[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-component contract: Kubernetes CRD types, auth helpers, and config for the open-websandbox Rust control plane."

[lib]
path = "src/lib.rs"

# OTLP exporter feature gate (issue #83). Default-on preserves the D9 behaviour
# (OTLP wired in unconditionally). Disable with `--no-default-features` for slim
# builds that drop tonic/prost (OTel gRPC + protobuf) + the OTLP HTTP client (reqwest). The `metrics`
# facade + Prometheus `/metrics` and the `opentelemetry` tracing SDK stay
# always-on; ONLY the OTLP *exporter transport* is gated. broker/runtime forward
# this feature so `cargo build -p broker --no-default-features` actually drops it.
[features]
default = ["telemetry-otlp"]
telemetry-otlp = ["dep:opentelemetry-otlp"]

# All dependency versions are pinned once in the root `[workspace.dependencies]`
# (../Cargo.toml) so the whole tree stays single-version and auditable (D8).
[dependencies]
anyhow.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp = { workspace = true, optional = true }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
utoipa.workspace = true

[dev-dependencies]
# OTel test support (issue #74): the in-memory span exporter + synchronous
# SimpleSpanProcessor live behind opentelemetry_sdk's `testing` feature. These
# are test-only; `testing` never reaches broker/runtime production builds
# (dev-dependencies are not propagated to dependents).
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

# Issue #100 / B5: opt into the workspace-wide lint config (clippy::pedantic
# at `warn`, neg. priority). See `[workspace.lints]` in the root manifest.
[lints]
workspace = true
