[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sandbox runtime (axum + tokio): hardened /execute + /files/* surface for the open-websandbox Rust control plane."

[lib]
path = "src/lib.rs"

[[bin]]
name = "runtime"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8"
# `http-body-util` is already a transitive dep of axum; the `channel` feature adds
# only `tokio` (also present), so this introduces NO new crates into the audited
# tree. Used for restore (`BodyExt::frame` on the inbound request body) and
# snapshot (`channel::Channel` to stream the zstd stdout into the response body
# from a producer task).
http-body-util = { version = "0.1", features = ["channel"] }
mime_guess = "2"
nix = { version = "0.29", features = ["resource", "signal", "process"] }
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
shared = { version = "0.1.0", path = "../shared" }
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http = "1"
tempfile = "3"
