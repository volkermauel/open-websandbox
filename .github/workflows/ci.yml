name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "ruff==0.16.2"
          pip install -r requirements-test.txt \
                      -r agent-sandbox-platform/runtime/requirements-app.txt \
                      -r agent-sandbox-platform/runtime/requirements-common.txt \
                      -r agent-sandbox-platform/broker/requirements.txt
      - name: Lint (ruff)
        run: ruff check agent-sandbox-platform
      - name: Unit tests + coverage (≥95% across broker + runtime)
        run: pytest tests/unit --cov=agent-sandbox-platform/broker --cov=agent-sandbox-platform/runtime --cov-branch --cov-report=term-missing --cov-fail-under=95
