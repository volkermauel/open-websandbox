name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            open-websandbox-platform/runtime/requirements-app.txt
            open-websandbox-platform/runtime/requirements-common.txt
            open-websandbox-platform/broker/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "ruff==0.16.2"
          pip install -r requirements-test.txt \
                      -r open-websandbox-platform/runtime/requirements-app.txt \
                      -r open-websandbox-platform/runtime/requirements-common.txt \
                      -r open-websandbox-platform/broker/requirements.txt
      - name: Lint (ruff)
        run: ruff check open-websandbox-platform
      - name: Unit tests + coverage (≥95% across broker + runtime)
        run: pytest tests/unit --cov=open-websandbox-platform/broker --cov=open-websandbox-platform/runtime --cov-branch --cov-report=term-missing --cov-fail-under=95
