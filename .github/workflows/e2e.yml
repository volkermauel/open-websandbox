name: e2e

# Full end-to-end: deploy the platform via the Helm chart into a KIND cluster and run
# tests/e2e against the live broker. Matrix covers both runtime backends:
#   - runc:   plain KIND node. Weaker isolation (no syscall filter) but it fully exercises
#             the broker→router→runtime path, the Helm chart, and the agent-sandbox
#             controller — the bulk of the integration surface.
#   - gvisor: runsc installed on the runner host and bind-mounted into the KIND node.
#             systrap needs no KVM, so this also runs locally (scripts/setup-kind-gvisor.sh).
#             The closest analog to production gVisor isolation.
#
# The router is self-built from upstream agent-sandbox@v0.5.6 (its Dockerfile COPYs
# internal/ api/ extensions/api/, so the build context is the upstream checkout).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel superseded runs of the same PR (or branch): only the newest SHA can
  # merge, so older pushes running to completion are pure waste (issue #172).
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      # Job-level: buildx registry build-cache push needs packages:write.
      # Fork PRs are downgraded to read-only by GitHub; cache-to is gated off there.
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, gvisor]
    env:
      KIND_CLUSTER: open-websandbox-e2e
      SYS_NS: agent-sandbox-system
      RUNTIME_NS: agent-sandbox-runtime
    steps:
      - uses: actions/checkout@v7

      - name: Derive e2e image tag from the chart (single source of truth)
        run: |
          TAG="$(grep -E '^imageTag:' open-websandbox-platform/chart/values.yaml | awk '{print $2}' | tr -d '"')"
          echo "E2E_TAG=$TAG" >> "$GITHUB_ENV"
          echo "e2e images will be tagged $TAG (chart values.yaml imageTag)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # gVisor leg only: install runsc + shim + gvisor-bin sidecar dir on the host so the
      # KIND node can bind-mount them. systrap needs no KVM, so this runs on any runner.
      - name: Install gVisor runsc on host
        if: matrix.runtime == 'gvisor'
        run: bash infra/kind/install-runsc.sh

      # Cache the kindest/node image tarball so it isn't re-pulled every run.
      # helm/kind-action has no built-in node-image cache, so we save/load the
      # Docker image ourselves; when present, `kind create cluster` reuses it.
      # NOTE: if node_image below is bumped, bump the cache key to match.
      - name: Cache KIND node image
        id: kind-image-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kindest-node.tar
          key: kindest-node-v1.31.0
      - name: Load KIND node image from cache
        if: steps.kind-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/kindest-node.tar
      - name: Pull & save KIND node image (cache miss)
        if: steps.kind-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull kindest/node:v1.31.0
          docker save kindest/node:v1.31.0 -o /tmp/kindest-node.tar

      # helm/kind-action installs kind + creates the cluster. For gVisor it uses a config
      # that mounts the host runsc into the node + registers it with containerd.
      - name: Create KIND cluster (${{ matrix.runtime }})
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.31.0
          config: ${{ matrix.runtime == 'gvisor' && 'infra/kind/kind-config-gvisor.yaml' || '' }}
          wait: 60s

      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5

      - name: Register gVisor RuntimeClass
        if: matrix.runtime == 'gvisor'
        run: |
          kubectl apply -f infra/kind/runtimeclass-gvisor.yaml
          docker exec "$KIND_CLUSTER-control-plane" /usr/local/bin/runsc --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # GHCR login for the buildx registry build cache (pull always; push on
      # same-repo events — see the cache-to gate in the build steps below).
      - name: Log in to GHCR (build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build via buildx with a GHCR registry (type=registry) layer cache, shared
      # across matrix legs, branches, and the release.yml builds. Unlike the old
      # gha cache there is no 10GB Actions-cache cap, so PR branches stop
      # evicting main's blobs (the +10-15m cold-start pain). Fork PRs: cache-to
      # is gated off below (read-only token); cache-from stays on.
      # provenance:false keeps a plain single-platform image that `kind load` accepts.
      - name: Build platform image (broker)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/broker/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-broker:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/broker:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/broker:buildkit,mode=max,scope=buildkit' || '' }}

      - name: Build platform image (runtime)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/runtime/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-runtime:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/runtime:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/runtime:buildkit,mode=max,scope=buildkit' || '' }}

      # Shallow-fetch upstream at the pinned tag into ./agent-sandbox so the router can be
      # self-built (no prebuilt image is published). Context = agent-sandbox/ because
      # sandbox-router/Dockerfile COPYs internal/ api/ extensions/api/.
      - name: Checkout upstream agent-sandbox@v0.5.6 (router self-build)
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.6
          path: agent-sandbox

      - name: Self-build sandbox-router
        uses: docker/build-push-action@v7
        with:
          context: agent-sandbox
          file: agent-sandbox/sandbox-router/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-router:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/router:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/router:buildkit,mode=max,scope=buildkit' || '' }}

      - name: Load images into KIND
        run: |
          for img in open-websandbox-broker:"$E2E_TAG" open-websandbox-runtime:"$E2E_TAG" open-websandbox-router:"$E2E_TAG"; do
            kind load docker-image "$img" --name "$KIND_CLUSTER"
          done

      # The agent-sandbox controller + CRDs (agents.x-k8s.io) are now installed by the
      # chart itself (chart/templates/upstream/, values.upstream.deploy=true default),
      # so the separate `kubectl apply -f .../upstream/*.yaml` step is no longer needed.
      - name: Helm install (${{ matrix.runtime }} profile)
        run: |
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          # Pre-apply the vendored CRDs and wait for establishment so helm can build the
          # SandboxTemplate instance in one pass (helm applies crds/ but does not wait for
          # the API server to establish them -> intermittent 'no matches for kind' failures).
          kubectl apply -f open-websandbox-platform/chart/crds/
          kubectl wait --for=condition=Established --all crd --timeout=120s || true
          helm install open-websandbox open-websandbox-platform/chart/ \
            -f "$VALUES_FILE" -n "$SYS_NS"
          kubectl -n "$SYS_NS" rollout status deploy/owui-broker --timeout=180s
          # No warm-pool wait: values.yaml sets warmPool.replicas: 0 (issue #4) and
          # no values-kind*.yaml overlay overrides it, so no warm Sandbox can ever
          # turn Ready — the old 60x5s poll here was a guaranteed 5m dead wait
          # (issue #172). Re-add a wait only if a lane enables the pool.
        env:
          # runc → values-kind.yaml; gvisor → values-kind-gvisor.yaml
          VALUES_FILE: open-websandbox-platform/chart/values-kind${{ matrix.runtime == 'gvisor' && '-gvisor' || '' }}.yaml


      - name: Diagnostics (on failure)
        if: failure()
        run: |
          echo "=== broker/router pods ==="
          kubectl -n "$SYS_NS" get pods -o wide || true
          echo "=== broker describe + logs ==="
          kubectl -n "$SYS_NS" describe deploy/owui-broker --timeout=10s || true
          kubectl -n "$SYS_NS" logs deploy/owui-broker --tail=100 || true
          echo "=== /readyz + /healthz (probed via port-forward) ==="
          kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 &
          PF=$!; sleep 3
          curl -sS http://localhost:8889/readyz; echo
          curl -sS http://localhost:8889/healthz; echo
          kill "$PF" 2>/dev/null || true
          echo "=== runtime sandboxes + recent events ==="
          kubectl -n "$RUNTIME_NS" get sandbox -o wide || true
          kubectl -n "$SYS_NS" get events --sort-by=.lastTimestamp | tail -25 || true
      - name: Install test deps
        run: pip install -r requirements-test.txt

      - name: Run e2e suite
        run: |
          set -euo pipefail
          kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 &
          PF=$!
          # Wait for the port-forward to accept connections.
          for i in $(seq 1 30); do curl -sf http://localhost:8889/healthz >/dev/null && break; sleep 1; done
          # Read the REAL broker shared secret (the chart auto-generates one via lookup;
          # the old hardcoded placeholder was rejected by the broker's fail-closed check).
          SECRET="$(kubectl -n "$SYS_NS" get secret owui-broker-secret \
            -o jsonpath='{.data.shared-secret}' | base64 -d)"
          # KUBECONFIG: test_ws_touch.py reads sandbox annotations via kubectl;
          # export the kind kubeconfig so the test runs instead of skipping.
          KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
            BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" pytest tests/e2e -v
          kill "$PF"

  # S3-tiered e2e (issue #52): a SEPARATE job (runc only) that deploys an in-cluster
  # MinIO, installs the chart with broker.s3.enabled=true + persistentMode=s3-tiered,
  # and runs the three mandatory S3 scenarios (offload-on-reap, restore-on-resume,
  # cross-session isolation). It is opt-in and independent of the default runc/gvisor
  # matrix, so default e2e behavior is unchanged (broker.s3.enabled defaults OFF).
  e2e-s3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # buildx registry build cache (ghcr.io/volkermauel/cache/*)
    timeout-minutes: 35
    env:
      KIND_CLUSTER: open-websandbox-e2e-s3
      SYS_NS: agent-sandbox-system
      RUNTIME_NS: agent-sandbox-runtime
    steps:
      - uses: actions/checkout@v7
      - name: Derive e2e image tag from the chart (single source of truth)
        run: |
          TAG="$(grep -E '^imageTag:' open-websandbox-platform/chart/values.yaml | awk '{print $2}' | tr -d '"')"
          echo "E2E_TAG=$TAG" >> "$GITHUB_ENV"
          echo "e2e images will be tagged $TAG (chart values.yaml imageTag)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Cache KIND node image
        id: kind-image-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kindest-node.tar
          key: kindest-node-v1.31.0
      - name: Load KIND node image from cache
        if: steps.kind-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/kindest-node.tar
      - name: Pull & save KIND node image (cache miss)
        if: steps.kind-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull kindest/node:v1.31.0
          docker save kindest/node:v1.31.0 -o /tmp/kindest-node.tar

      - name: Create KIND cluster (runc)
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.31.0
          wait: 60s

      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build platform image (broker)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/broker/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-broker:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/broker:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/broker:buildkit,mode=max,scope=buildkit' || '' }}
      - name: Build platform image (runtime)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/runtime/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-runtime:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/runtime:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/runtime:buildkit,mode=max,scope=buildkit' || '' }}

      - name: Checkout upstream agent-sandbox@v0.5.6 (router self-build)
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.6
          path: agent-sandbox
      - name: Self-build sandbox-router
        uses: docker/build-push-action@v7
        with:
          context: agent-sandbox
          file: agent-sandbox/sandbox-router/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-router:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/router:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/router:buildkit,mode=max,scope=buildkit' || '' }}

      - name: Load images into KIND
        run: |
          for img in open-websandbox-broker:"$E2E_TAG" open-websandbox-runtime:"$E2E_TAG" open-websandbox-router:"$E2E_TAG"; do
            kind load docker-image "$img" --name "$KIND_CLUSTER"
          done

      - name: Deploy MinIO fixture + namespaces
        run: |
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          # Pre-apply the vendored CRDs and wait for establishment before helm install
          # (see the matrix profile step for rationale).
          kubectl apply -f open-websandbox-platform/chart/crds/
          kubectl wait --for=condition=Established --all crd --timeout=120s || true
          kubectl -n "$SYS_NS" apply -f tests/e2e/fixtures/minio.yaml
          kubectl -n "$SYS_NS" rollout status deploy/minio --timeout=180s

      - name: Helm install (s3-tiered profile)
        run: |
          helm install open-websandbox open-websandbox-platform/chart/ \
            -f open-websandbox-platform/chart/values-kind-s3.yaml -n "$SYS_NS"
          kubectl -n "$SYS_NS" rollout status deploy/owui-broker --timeout=180s

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          echo "=== broker/minio pods ==="
          kubectl -n "$SYS_NS" get pods -o wide || true
          echo "=== broker logs ==="
          kubectl -n "$SYS_NS" logs deploy/owui-broker --tail=200 || true
          echo "=== runtime sandboxes ==="
          kubectl -n "$RUNTIME_NS" get sandbox -o wide || true
          echo "=== runtime pod logs (last 6 by age) ==="
          for p in $(kubectl -n "$RUNTIME_NS" get pods --sort-by=.metadata.creationTimestamp -o name | tail -6); do
            echo "--- $p ---"
            kubectl -n "$RUNTIME_NS" logs "$p" --tail=80 || true
          done
          kubectl -n "$SYS_NS" get events --sort-by=.lastTimestamp | tail -25 || true

      - name: Install test deps
        run: pip install -r requirements-test.txt

      - name: Run S3 e2e suite
        run: |
          set -euo pipefail
          kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 &
          PF=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8889/healthz >/dev/null && break; sleep 1; done
          SECRET="$(kubectl -n "$SYS_NS" get secret owui-broker-secret \
            -o jsonpath='{.data.shared-secret}' | base64 -d)"
          # E2E_S3=1 enables the MinIO-backed scenarios; the default e2e tests skip fast
          # (require_broker still passes, ready_session claims a persistent s3-tiered pod).
          BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" E2E_S3=1 \
            pytest tests/e2e/test_s3_tiered.py -v
          kill "$PF"

  # Hybrid PVC×S3 tiering e2e (issues #142/#144): runc-only matrix over the two
  # SLOW (~10 m pytest each) lanes. They stay on dedicated parallel runners —
  # serializing them on one shared cluster would trade +16 m wall-clock for
  # −4.6 runner-min (design A, rejected in #177's investigation) — while the four
  # FAST PVC-family modes share one sequential cluster in e2e-pvc-fast below.
  # pvc-s3        — #142 hybrid: per-user-pvc hot tier (broker-created
  #                 workspace-p-<sha256(user)[:12]> local-path RWO) × MinIO
  #                 cold tier. Proves tiering is hot-tier independent
  #                 (park-resume = hot hit, no S3 clobber; reap = offload +
  #                 PVC purge + cold restore).
  # pvc-s3-shared — #144: the same hybrid proof on the shared-PVC hot tier
  #                 (chart-rendered workspace-shared PVC + per-chat subPath).
  # All lanes prove: persistence across Sandbox deletion, cross-chat isolation
  # (a chat can only see/delete its own directory), cross-user isolation.
  e2e-pvc-s3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # buildx registry build cache (ghcr.io/volkermauel/cache/*)
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [pvc-s3, pvc-s3-shared]
    env:
      KIND_CLUSTER: open-websandbox-e2e-pvc-s3
      SYS_NS: agent-sandbox-system
      RUNTIME_NS: agent-sandbox-runtime
    steps:
      - uses: actions/checkout@v7
      - name: Derive e2e image tag from the chart (single source of truth)
        run: |
          TAG="$(grep -E '^imageTag:' open-websandbox-platform/chart/values.yaml | awk '{print $2}' | tr -d '"')"
          echo "E2E_TAG=$TAG" >> "$GITHUB_ENV"
          echo "e2e images will be tagged $TAG (chart values.yaml imageTag)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Cache KIND node image
        id: kind-image-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kindest-node.tar
          key: kindest-node-v1.31.0
      - name: Load KIND node image from cache
        if: steps.kind-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/kindest-node.tar
      - name: Pull & save KIND node image (cache miss)
        if: steps.kind-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull kindest/node:v1.31.0
          docker save kindest/node:v1.31.0 -o /tmp/kindest-node.tar

      - name: Create KIND cluster (runc)
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.31.0
          wait: 60s

      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build platform image (broker)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/broker/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-broker:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/broker:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/broker:buildkit,mode=max,scope=buildkit' || '' }}
      - name: Build platform image (runtime)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/runtime/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-runtime:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/runtime:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/runtime:buildkit,mode=max,scope=buildkit' || '' }}

      - name: Checkout upstream agent-sandbox@v0.5.6 (router self-build)
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.6
          path: agent-sandbox
      - name: Self-build sandbox-router
        uses: docker/build-push-action@v7
        with:
          context: agent-sandbox
          file: agent-sandbox/sandbox-router/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-router:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/router:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/router:buildkit,mode=max,scope=buildkit' || '' }}

      - name: Load images into KIND
        run: |
          for img in open-websandbox-broker:"$E2E_TAG" open-websandbox-runtime:"$E2E_TAG" open-websandbox-router:"$E2E_TAG"; do
            kind load docker-image "$img" --name "$KIND_CLUSTER"
          done

      - name: Deploy namespaces + CRDs
        run: |
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f open-websandbox-platform/chart/crds/
          kubectl wait --for=condition=Established --all crd --timeout=120s || true

      - name: Deploy MinIO fixture (hybrid lanes only)
        if: matrix.mode == 'pvc-s3' || matrix.mode == 'pvc-s3-shared'
        run: |
          kubectl -n "$SYS_NS" apply -f tests/e2e/fixtures/minio.yaml
          kubectl -n "$SYS_NS" rollout status deploy/minio --timeout=180s

      - name: Helm install (${{ matrix.mode }} profile)
        run: |
          VALUES="open-websandbox-platform/chart/values-kind-pvc.yaml"
          if [ "${{ matrix.mode }}" = "shared-subpath" ]; then
            VALUES="open-websandbox-platform/chart/values-kind-pvc-shared.yaml"
          fi
          if [ "${{ matrix.mode }}" = "pvc-s3" ]; then
            VALUES="open-websandbox-platform/chart/values-kind-pvc-s3.yaml"
          fi
          if [ "${{ matrix.mode }}" = "pvc-s3-shared" ]; then
            VALUES="open-websandbox-platform/chart/values-kind-pvc-shared-s3.yaml"
          fi
          helm install open-websandbox open-websandbox-platform/chart/ \
            -f "$VALUES" -n "$SYS_NS"
          kubectl -n "$SYS_NS" rollout status deploy/owui-broker --timeout=180s

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          echo "=== broker pods ==="
          kubectl -n "$SYS_NS" get pods -o wide || true
          echo "=== broker logs ==="
          kubectl -n "$SYS_NS" logs deploy/owui-broker --tail=200 || true
          echo "=== PVCs ==="
          kubectl -n "$RUNTIME_NS" get pvc -o wide || true
          echo "=== runtime sandboxes ==="
          kubectl -n "$RUNTIME_NS" get sandbox -o wide || true
          echo "=== runtime pod logs (last 6 by age) ==="
          for p in $(kubectl -n "$RUNTIME_NS" get pods --sort-by=.metadata.creationTimestamp -o name | tail -6); do
            echo "--- $p ---"
            kubectl -n "$RUNTIME_NS" logs "$p" --tail=80 || true
          done
          kubectl -n "$SYS_NS" get events --sort-by=.lastTimestamp | tail -25 || true

      - name: Install test deps
        run: pip install -r requirements-test.txt

      - name: Run PVC e2e suite (${{ matrix.mode }})
        run: |
          set -euo pipefail
          kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 &
          PF=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8889/healthz >/dev/null && break; sleep 1; done
          SECRET="$(kubectl -n "$SYS_NS" get secret owui-broker-secret \
            -o jsonpath='{.data.shared-secret}' | base64 -d)"
          if [ "${{ matrix.mode }}" = "drain" ]; then
            # #146: pod-eviction resilience on the per-user PVC profile. The live
            # WS dies with the pod; reconnect re-resolves the recreated pod,
            # replays the SIGTERM-flushed scrollback, and the marker file
            # survives on the PVC.
            BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" \
            E2E_DRAIN=1 \
              pytest tests/e2e/test_node_drain.py -v
          elif [ "${{ matrix.mode }}" = "pvc-s3" ] || [ "${{ matrix.mode }}" = "pvc-s3-shared" ]; then
            # The reaper offloads to MinIO regardless of which module runs;
            # create the bucket BEFORE pytest so non-s3 modules (which never
            # resolve require_s3) don't fight offload failures.
            python tests/e2e/ensure_minio_bucket.py
            # #142/#144 hybrid: PVC tests + the s3-tiered suite (hot-tier-agnostic)
            # + the hybrid tiering suite — against EITHER PVC hot tier.
            if [ "${{ matrix.mode }}" = "pvc-s3" ]; then
              PVC_MODE=per-user-pvc
            else
              PVC_MODE=shared-subpath
            fi
            BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" \
            E2E_PVC=1 E2E_PVC_MODE="$PVC_MODE" E2E_S3=1 E2E_PVC_S3=1 \
              pytest tests/e2e/test_pvc_persistence.py tests/e2e/test_s3_tiered.py \
                     tests/e2e/test_pvc_s3_tiering.py -v
          else
            BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" \
            E2E_PVC=1 E2E_PVC_MODE=${{ matrix.mode }} \
              pytest tests/e2e/test_pvc_persistence.py -v
          fi
          kill "$PF"

  # FAST PVC-family lanes on ONE shared KIND cluster (issue #177, design B+ of
  # the #175 investigation): the fixed cost — cluster create, broker/runtime/
  # router builds, kind load — is paid once and the four fast modes run
  # sequentially on the same cluster:
  #   per-user-pvc → shared-subpath → rate-limit → drain
  # (drain LAST: it deletes a sandbox pod with a 30s grace period, so no later
  # mode can trip over the eviction). The two ~10-min S3 suites stay on their
  # own parallel runners (e2e-pvc-s3 above).
  #
  # Sharing is made safe by a full reset between modes:
  #   helm uninstall owui || true
  #   kubectl delete ns agent-sandbox-system agent-sandbox-runtime \
  #     --wait --ignore-not-found=true
  # Those two namespaces hold EVERYTHING mode-local: the chart release and its
  # objects (broker, router, upstream controller, workspace-shared PVC,
  # owui-broker-secret — regenerated per install), the broker-created
  # workspace-p-* PVCs and owui-c-* Sandbox CRs (no Helm ownership — they
  # survive a bare helm uninstall), ResourceQuota/NetworkPolicy leftovers.
  # Namespace deletion is the only provably-clean reset; do not weaken it.
  # Cluster-scoped agents.x-k8s.io CRDs survive the reset and are reused
  # as-is; the next cycle's helm install recreates both namespaces and
  # re-ships the upstream controller (chart upstream.deploy=true default —
  # never apply chart/upstream manifests by hand).
  #
  # Port-forward + broker secret are re-established PER mode: a port-forward
  # pins to ONE broker pod, so a stale forward from the previous install
  # 401s against the regenerated secret (the #164 verification detour). Each
  # run step kills any orphaned listener (fuser) before starting a fresh
  # detached forward and reads owui-broker-secret anew.
  #
  # One job = one failure domain: a failed mode aborts the remaining modes —
  # accepted per #177 (the fast suites are historically stable; expected
  # ~8 m warm vs ~11 m across four separate runners).
  e2e-pvc-fast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # buildx registry build cache (ghcr.io/volkermauel/cache/*)
    timeout-minutes: 25
    env:
      KIND_CLUSTER: open-websandbox-e2e-pvc-fast
      SYS_NS: agent-sandbox-system
      RUNTIME_NS: agent-sandbox-runtime
    steps:
      - uses: actions/checkout@v7
      - name: Derive e2e image tag from the chart (single source of truth)
        run: |
          TAG="$(grep -E '^imageTag:' open-websandbox-platform/chart/values.yaml | awk '{print $2}' | tr -d '"')"
          echo "E2E_TAG=$TAG" >> "$GITHUB_ENV"
          echo "e2e images will be tagged $TAG (chart values.yaml imageTag)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Cache KIND node image
        id: kind-image-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kindest-node.tar
          key: kindest-node-v1.31.0
      - name: Load KIND node image from cache
        if: steps.kind-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/kindest-node.tar
      - name: Pull & save KIND node image (cache miss)
        if: steps.kind-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull kindest/node:v1.31.0
          docker save kindest/node:v1.31.0 -o /tmp/kindest-node.tar

      - name: Create KIND cluster (runc)
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.31.0
          wait: 60s

      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build platform image (broker)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/broker/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-broker:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/broker:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/broker:buildkit,mode=max,scope=buildkit' || '' }}
      - name: Build platform image (runtime)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/runtime/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-runtime:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/runtime:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/runtime:buildkit,mode=max,scope=buildkit' || '' }}

      - name: Checkout upstream agent-sandbox@v0.5.6 (router self-build)
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.6
          path: agent-sandbox
      - name: Self-build sandbox-router
        uses: docker/build-push-action@v7
        with:
          context: agent-sandbox
          file: agent-sandbox/sandbox-router/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-router:${{ env.E2E_TAG }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/router:buildkit
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/volkermauel/cache/router:buildkit,mode=max,scope=buildkit' || '' }}

      - name: Load images into KIND
        run: |
          for img in open-websandbox-broker:"$E2E_TAG" open-websandbox-runtime:"$E2E_TAG" open-websandbox-router:"$E2E_TAG"; do
            kind load docker-image "$img" --name "$KIND_CLUSTER"
          done

      # Once: first-install namespaces + cluster-scoped CRDs. The CRDs survive
      # every per-mode namespace reset below, so re-applying them per cycle is
      # unnecessary (and helm would skip them anyway — crds/ install only
      # applies missing CRDs).
      - name: Deploy namespaces + CRDs
        run: |
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f open-websandbox-platform/chart/crds/
          kubectl wait --for=condition=Established --all crd --timeout=120s || true

      - name: Install test deps
        run: pip install -r requirements-test.txt

      # ---- mode 1/4: per-user-pvc (values-kind-pvc.yaml) ----------------------
      - name: Helm install (per-user-pvc profile)
        run: |
          # Recreate the namespaces deleted by the previous mode's reset
          # (idempotent no-op on this first cycle). --create-namespace only
          # covers the release namespace and the chart renders no Namespace
          # objects, so the runtime namespace must exist before helm installs
          # the SandboxTemplate/policies into it.
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          helm install owui open-websandbox-platform/chart/ \
            -f open-websandbox-platform/chart/values-kind-pvc.yaml \
            -n "$SYS_NS" --create-namespace
          kubectl -n "$SYS_NS" rollout status deploy/owui-broker --timeout=180s

      - name: Diagnostics (per-user-pvc, on failure)
        if: failure()
        run: |
          echo "=== broker pods ==="
          kubectl -n "$SYS_NS" get pods -o wide || true
          echo "=== broker logs ==="
          kubectl -n "$SYS_NS" logs deploy/owui-broker --tail=200 || true
          echo "=== PVCs ==="
          kubectl -n "$RUNTIME_NS" get pvc -o wide || true
          echo "=== runtime sandboxes ==="
          kubectl -n "$RUNTIME_NS" get sandbox -o wide || true
          echo "=== runtime pod logs (last 6 by age) ==="
          for p in $(kubectl -n "$RUNTIME_NS" get pods --sort-by=.metadata.creationTimestamp -o name | tail -6); do
            echo "--- $p ---"
            kubectl -n "$RUNTIME_NS" logs "$p" --tail=80 || true
          done
          kubectl -n "$SYS_NS" get events --sort-by=.lastTimestamp | tail -25 || true

      - name: Run PVC e2e suite (per-user-pvc)
        run: |
          set -euo pipefail
          # Kill any port-forward orphaned by a failed earlier mode, then start
          # a fresh one: the forward pins to ONE broker pod, and this cycle's
          # install replaced both the pod and its secret (#164 detour).
          fuser -k 8889/tcp || true
          nohup kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 >/tmp/broker-pf.log 2>&1 &
          PF=$!
          # Wait for the port-forward to accept connections.
          for i in $(seq 1 30); do curl -sf http://localhost:8889/healthz >/dev/null && break; sleep 1; done
          # Read the REAL broker shared secret (regenerated by every install
          # in this shared-cluster job).
          SECRET="$(kubectl -n "$SYS_NS" get secret owui-broker-secret \
            -o jsonpath='{.data.shared-secret}' | base64 -d)"
          KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
          BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" \
          E2E_PVC=1 E2E_PVC_MODE=per-user-pvc \
            pytest tests/e2e/test_pvc_persistence.py -v
          kill "$PF"

      - name: Reset cluster for next mode (after per-user-pvc)
        run: |
          helm uninstall owui -n "$SYS_NS" --ignore-not-found || true
          kubectl delete ns "$SYS_NS" "$RUNTIME_NS" --wait --ignore-not-found=true

      # ---- mode 2/4: shared-subpath (values-kind-pvc-shared.yaml) -------------
      - name: Helm install (shared-subpath profile)
        run: |
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          helm install owui open-websandbox-platform/chart/ \
            -f open-websandbox-platform/chart/values-kind-pvc-shared.yaml \
            -n "$SYS_NS" --create-namespace
          kubectl -n "$SYS_NS" rollout status deploy/owui-broker --timeout=180s

      - name: Diagnostics (shared-subpath, on failure)
        if: failure()
        run: |
          echo "=== broker pods ==="
          kubectl -n "$SYS_NS" get pods -o wide || true
          echo "=== broker logs ==="
          kubectl -n "$SYS_NS" logs deploy/owui-broker --tail=200 || true
          echo "=== PVCs ==="
          kubectl -n "$RUNTIME_NS" get pvc -o wide || true
          echo "=== runtime sandboxes ==="
          kubectl -n "$RUNTIME_NS" get sandbox -o wide || true
          echo "=== runtime pod logs (last 6 by age) ==="
          for p in $(kubectl -n "$RUNTIME_NS" get pods --sort-by=.metadata.creationTimestamp -o name | tail -6); do
            echo "--- $p ---"
            kubectl -n "$RUNTIME_NS" logs "$p" --tail=80 || true
          done
          kubectl -n "$SYS_NS" get events --sort-by=.lastTimestamp | tail -25 || true

      - name: Run PVC e2e suite (shared-subpath)
        run: |
          set -euo pipefail
          fuser -k 8889/tcp || true
          nohup kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 >/tmp/broker-pf.log 2>&1 &
          PF=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8889/healthz >/dev/null && break; sleep 1; done
          SECRET="$(kubectl -n "$SYS_NS" get secret owui-broker-secret \
            -o jsonpath='{.data.shared-secret}' | base64 -d)"
          KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
          BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" \
          E2E_PVC=1 E2E_PVC_MODE=shared-subpath \
            pytest tests/e2e/test_pvc_persistence.py -v
          kill "$PF"

      - name: Reset cluster for next mode (after shared-subpath)
        run: |
          helm uninstall owui -n "$SYS_NS" --ignore-not-found || true
          kubectl delete ns "$SYS_NS" "$RUNTIME_NS" --wait --ignore-not-found=true

      # ---- mode 3/4: rate-limit (values-kind.yaml + values-kind-rl.yaml) -----
      # #161: rate-limit scope (per chat + per-user aggregate). Deliberately
      # TINY buckets (values-kind-rl.yaml: 5 rps / burst 10 / x3) so the
      # per-chat 429, the sibling-chat pass-through, and the per-user
      # aggregate 429 are all fast and deterministic.
      - name: Helm install (rate-limit profile)
        run: |
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          helm install owui open-websandbox-platform/chart/ \
            -f open-websandbox-platform/chart/values-kind.yaml \
            -f open-websandbox-platform/chart/values-kind-rl.yaml \
            -n "$SYS_NS" --create-namespace
          kubectl -n "$SYS_NS" rollout status deploy/owui-broker --timeout=180s

      - name: Diagnostics (rate-limit, on failure)
        if: failure()
        run: |
          echo "=== broker pods ==="
          kubectl -n "$SYS_NS" get pods -o wide || true
          echo "=== broker logs ==="
          kubectl -n "$SYS_NS" logs deploy/owui-broker --tail=200 || true
          echo "=== PVCs ==="
          kubectl -n "$RUNTIME_NS" get pvc -o wide || true
          echo "=== runtime sandboxes ==="
          kubectl -n "$RUNTIME_NS" get sandbox -o wide || true
          echo "=== runtime pod logs (last 6 by age) ==="
          for p in $(kubectl -n "$RUNTIME_NS" get pods --sort-by=.metadata.creationTimestamp -o name | tail -6); do
            echo "--- $p ---"
            kubectl -n "$RUNTIME_NS" logs "$p" --tail=80 || true
          done
          kubectl -n "$SYS_NS" get events --sort-by=.lastTimestamp | tail -25 || true

      - name: Run rate-limit e2e
        run: |
          set -euo pipefail
          fuser -k 8889/tcp || true
          nohup kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 >/tmp/broker-pf.log 2>&1 &
          PF=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8889/healthz >/dev/null && break; sleep 1; done
          SECRET="$(kubectl -n "$SYS_NS" get secret owui-broker-secret \
            -o jsonpath='{.data.shared-secret}' | base64 -d)"
          KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
          BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" E2E_RATE_LIMIT=1 \
            pytest tests/e2e/test_rate_limit.py -v
          kill "$PF"

      - name: Reset cluster for next mode (after rate-limit)
        run: |
          helm uninstall owui -n "$SYS_NS" --ignore-not-found || true
          kubectl delete ns "$SYS_NS" "$RUNTIME_NS" --wait --ignore-not-found=true

      # ---- mode 4/4: drain (values-kind-pvc.yaml) — LAST: deletes a pod -------
      - name: Helm install (drain profile)
        run: |
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          helm install owui open-websandbox-platform/chart/ \
            -f open-websandbox-platform/chart/values-kind-pvc.yaml \
            -n "$SYS_NS" --create-namespace
          kubectl -n "$SYS_NS" rollout status deploy/owui-broker --timeout=180s

      - name: Diagnostics (drain, on failure)
        if: failure()
        run: |
          echo "=== broker pods ==="
          kubectl -n "$SYS_NS" get pods -o wide || true
          echo "=== broker logs ==="
          kubectl -n "$SYS_NS" logs deploy/owui-broker --tail=200 || true
          echo "=== PVCs ==="
          kubectl -n "$RUNTIME_NS" get pvc -o wide || true
          echo "=== runtime sandboxes ==="
          kubectl -n "$RUNTIME_NS" get sandbox -o wide || true
          echo "=== runtime pod logs (last 6 by age) ==="
          for p in $(kubectl -n "$RUNTIME_NS" get pods --sort-by=.metadata.creationTimestamp -o name | tail -6); do
            echo "--- $p ---"
            kubectl -n "$RUNTIME_NS" logs "$p" --tail=80 || true
          done
          kubectl -n "$SYS_NS" get events --sort-by=.lastTimestamp | tail -25 || true

      - name: Run drain e2e suite
        run: |
          set -euo pipefail
          fuser -k 8889/tcp || true
          nohup kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 >/tmp/broker-pf.log 2>&1 &
          PF=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8889/healthz >/dev/null && break; sleep 1; done
          SECRET="$(kubectl -n "$SYS_NS" get secret owui-broker-secret \
            -o jsonpath='{.data.shared-secret}' | base64 -d)"
          # #146: pod-eviction resilience on the per-user PVC profile. The live
          # WS dies with the pod; reconnect re-resolves the recreated pod,
          # replays the SIGTERM-flushed scrollback, and the marker file
          # survives on the PVC.
          KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
          BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" \
          E2E_DRAIN=1 \
            pytest tests/e2e/test_node_drain.py -v
          kill "$PF"
          # No reset after the final mode: the runner (and its cluster) is
          # torn down with the job.
