name: release

# Builds + publishes the three images on a version tag (v*.*.*).
#   broker / runtime  -> built from this repo's Dockerfiles
#   router            -> SELF-BUILT from upstream kubernetes-sigs/agent-sandbox@v0.5.6
#                        (decision D3 — reproducible, version-locked; no ad-hoc :latest)
# Images: ghcr.io/${{ repository_owner }}/open-websandbox-{broker,runtime,router}:<tag>
# CI uses the built-in GITHUB_TOKEN; no owner secret required.

on:
  # Issue #100 (B2): trivy image scans also run on PRs (report-only) so CVEs
  # surface before a tag. The heavy build/publish/release jobs stay tag-only
  # via per-job `if:` guards below.
  pull_request:
    branches: [main]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub Release + upload SBOM assets
  packages: write   # push images + OCI signature ref-tags to ghcr.io
  id-token: write   # keyless cosign signing via GitHub OIDC (sigstore)

concurrency:
  # Cancel superseded runs of the same PR: only the newest SHA can merge.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    # Native per-arch builds (issue #175): arm64 compiles on real
    # ubuntu-24.04-arm runners instead of qemu emulation (~3-5x faster for
    # rustc). Each arch pushes a <tag>-<arch> image; release-images merges
    # them into the final multi-arch manifest list.
    name: build open-websandbox-${{ matrix.image }} (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Full product matrix (3 images x 2 arch = 6 legs). Do NOT use
        # `include:` without axis keys: such entries merge into EVERY
        # combination and later entries overwrite earlier ones (the v0.1.4
        # first run built only router).
        image: [broker, runtime, router]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream agent-sandbox@v0.5.6
        if: matrix.image == 'router'
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.6
          path: agent-sandbox
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'router' && 'agent-sandbox' || 'rust' }}
          file: ${{ matrix.image == 'router' && 'agent-sandbox/sandbox-router/Dockerfile' || format('rust/{0}/Dockerfile', matrix.image) }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-websandbox-${{ matrix.image }}:${{ github.ref_name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/volkermauel/cache/${{ matrix.image }}:buildkit
          cache-to: type=registry,ref=ghcr.io/volkermauel/cache/${{ matrix.image }}:buildkit,mode=max,scope=buildkit
          build-args: ${{ matrix.image == 'router' && 'VERSION=v0.5.6' || '' }}

  release-images:
    # Merge the per-arch images into the final multi-arch manifest list
    # (<tag>, sha-<short>, router: agent-sandbox-v0.5.6), then sign the
    # manifest digest and generate the SBOM from it (keyless cosign, syft —
    # same supply-chain contract as before, now on the merged list).
    name: merge+sign+sbom open-websandbox-${{ matrix.image }}
    needs: [build-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [broker, runtime, router]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge arch images into multi-arch manifest list
        id: merge
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-websandbox-${{ matrix.image }}
          TAG: ${{ github.ref_name }}
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          EXTRA_TAGS=()
          if [ "${{ matrix.image }}" = "router" ]; then
            EXTRA_TAGS+=(-t "${IMAGE}:agent-sandbox-v0.5.6")
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${SHA_TAG}" \
            "${EXTRA_TAGS[@]}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          # The created manifest list's digest: first sha256 in the inspect
          # output is the list itself (create's own output has no digest).
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            | grep -oE 'sha256:[0-9a-f]{64}' | head -n1)"
          test -n "${DIGEST}" || { echo "no digest from imagetools inspect"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, sigstore / GitHub OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-websandbox-${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${{ steps.merge.outputs.digest }}"
      - name: Generate image SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-websandbox-${{ matrix.image }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: open-websandbox-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
          artifact-name: open-websandbox-${{ matrix.image }}-sbom
          upload-artifact: true

  trivy-release:
    # Issue #100 (B2): scan the just-published tag images for HIGH/CRITICAL
    # CVEs. REPORT-ONLY (continue-on-error + exit-code 0) per maintainer decision:
    # surfacing only, does not gate a release. Scans the images built above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-images]
    name: trivy image (release, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: [open-websandbox-broker, open-websandbox-runtime, open-websandbox-router]
    steps:
      - uses: actions/checkout@v7
      - name: trivy image (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Private ghcr.io read auth for the published images.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  trivy-pr:
    # Issue #100 (B2): on PRs, build each image locally (load, no push) and scan
    # it for HIGH/CRITICAL CVEs. REPORT-ONLY: never blocks a PR. This catches
    # vulnerable base images / deps before a tag, without publishing anything.
    if: github.event_name == 'pull_request'
    name: trivy image (PR, report-only)
    runs-on: ubuntu-latest
    env:
      # Buildx registry cache ref for this matrix image (issue #172); the
      # matrix context is available in job-level env. Used by the build step's
      # cache-from/cache-to (the gated cache-to needs format() over this env).
      CACHE_REF: ghcr.io/volkermauel/cache/${{ matrix.cache-image }}:buildkit
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: open-websandbox-broker
            cache-image: broker   # buildx cache ref: ghcr.io/volkermauel/cache/broker
            context: rust
            dockerfile: rust/broker/Dockerfile
          - image: open-websandbox-runtime
            cache-image: runtime  # buildx cache ref: ghcr.io/volkermauel/cache/runtime
            context: rust
            dockerfile: rust/runtime/Dockerfile
          - image: open-websandbox-router
            cache-image: router   # buildx cache ref: ghcr.io/volkermauel/cache/router
            context: agent-sandbox
            dockerfile: agent-sandbox/sandbox-router/Dockerfile
            upstream: true
    steps:
      - uses: actions/checkout@v7
      - name: Checkout upstream agent-sandbox@v0.5.6
        if: matrix.upstream
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.6
          path: agent-sandbox
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (build cache)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:pr-scan
          # Registry cache (issue #172): read always, write gated to same-repo
          # PRs/branches (fork PRs get a read-only GITHUB_TOKEN).
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=registry,ref={0},mode=max,scope=buildkit', env.CACHE_REF) || '' }}
      - name: trivy image (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:pr-scan
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  chart-release:
    # Publish the Helm chart to OCI and cut a GitHub Release; tags only.
    needs: [release-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version flow: the git tag is the single source of truth and drives BOTH
      # chart fields via `helm package` flags (Chart.yaml is not edited at release):
      #   chart `version`    = tag without the leading 'v'  (SemVer forbids the 'v')
      #   chart `appVersion` = full tag incl. 'v'
      # Both derive from the same tag, so appVersion and version stay in lockstep.

      - name: Resolve tag
        id: tag
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        run: |
          helm package open-websandbox-platform/chart \
            --app-version "${{ steps.tag.outputs.tag }}" \
            --version "${{ steps.tag.outputs.version }}"
      # Generate an SBOM (SPDX JSON) of the packaged chart and attach it to the
      # GitHub Release alongside the .tgz. Scans the chart source that was just
      # packaged (identical to the .tgz contents; syft dir: mode is deterministic).
      - name: Generate chart SBOM
        uses: anchore/sbom-action@v0
        with:
          path: open-websandbox-platform/chart
          format: spdx-json
          output-file: open-websandbox-chart-${{ steps.tag.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Push chart to OCI registry
        run: |
          helm push open-websandbox-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Download image SBOMs
        uses: actions/download-artifact@v8
        with:
          path: image-sboms
          pattern: open-websandbox-*-sbom
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            open-websandbox-*.tgz
            open-websandbox-chart-*.spdx.json
            image-sboms/*
