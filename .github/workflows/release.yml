name: release

# Builds + publishes the three images on a version tag (v*.*.*).
#   broker / runtime  -> built from this repo's Dockerfiles
#   router            -> SELF-BUILT from upstream kubernetes-sigs/agent-sandbox@v0.5.3
#                        (decision D3 — reproducible, version-locked; no ad-hoc :latest)
# Images: ghcr.io/${{ repository_owner }}/open-sandbox-{broker,runtime,router}:<tag>
# CI uses the built-in GITHUB_TOKEN; no owner secret required.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub Release + upload SBOM assets
  packages: write   # push images + OCI signature ref-tags to ghcr.io
  id-token: write   # keyless cosign signing via GitHub OIDC (sigstore)

env:
  REGISTRY: ghcr.io

jobs:
  build-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-broker
          tags: |
            type=ref,event=tag
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: agent-sandbox-platform/broker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=open-sandbox-broker
          cache-to: type=gha,mode=max,scope=open-sandbox-broker
      # Supply-chain (issue #25): keyless cosign sign + per-image syft SBOM.
      # cosign signs the immutable digest and pushes the signature as an OCI
      # ref-tag (<repo>:sha256-<digest>.sig). The SBOM (SPDX-JSON) is uploaded
      # as a workflow artifact and attached to the GitHub Release by chart-release.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, sigstore / GitHub OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-broker
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate image SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-broker@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: open-sandbox-broker-${{ github.ref_name }}.spdx.json
          artifact-name: open-sandbox-broker-sbom
          upload-artifact: true

  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-runtime
          tags: |
            type=ref,event=tag
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: agent-sandbox-platform/runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=open-sandbox-runtime
          cache-to: type=gha,mode=max,scope=open-sandbox-runtime
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, sigstore / GitHub OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-runtime
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate image SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-runtime@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: open-sandbox-runtime-${{ github.ref_name }}.spdx.json
          artifact-name: open-sandbox-runtime-sbom
          upload-artifact: true

  build-router:
    # Self-build from upstream kubernetes-sigs/agent-sandbox (pinned tag).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream agent-sandbox@v0.5.3
        uses: actions/checkout@v5
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.3
          path: agent-sandbox
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-router
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=agent-sandbox-v0.5.3
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: agent-sandbox
          file: agent-sandbox/sandbox-router/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=open-sandbox-router
          cache-to: type=gha,mode=max,scope=open-sandbox-router
          build-args: |
            VERSION=v0.5.3
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, sigstore / GitHub OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-router
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate image SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-router@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: open-sandbox-router-${{ github.ref_name }}.spdx.json
          artifact-name: open-sandbox-router-sbom
          upload-artifact: true

  chart-release:
    # Publish the Helm chart to OCI and cut a GitHub Release; tags only.
    needs: [build-broker, build-runtime, build-router]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Version flow: the git tag is the single source of truth and drives BOTH
      # chart fields via `helm package` flags (Chart.yaml is not edited at release):
      #   chart `version`    = tag without the leading 'v'  (SemVer forbids the 'v')
      #   chart `appVersion` = full tag incl. 'v'
      # Both derive from the same tag, so appVersion and version stay in lockstep.

      - name: Resolve tag
        id: tag
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        run: |
          helm package agent-sandbox-platform/chart \
            --app-version "${{ steps.tag.outputs.tag }}" \
            --version "${{ steps.tag.outputs.version }}"
      # Generate an SBOM (SPDX JSON) of the packaged chart and attach it to the
      # GitHub Release alongside the .tgz. Scans the chart source that was just
      # packaged (identical to the .tgz contents; syft dir: mode is deterministic).
      - name: Generate chart SBOM
        uses: anchore/sbom-action@v0
        with:
          path: agent-sandbox-platform/chart
          format: spdx-json
          output-file: open-sandbox-chart-${{ steps.tag.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Push chart to OCI registry
        run: |
          helm push open-sandbox-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Download image SBOMs
        uses: actions/download-artifact@v4
        with:
          path: image-sboms
          pattern: open-sandbox-*-sbom
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            open-sandbox-*.tgz
            open-sandbox-chart-*.spdx.json
            image-sboms/*.spdx.json
