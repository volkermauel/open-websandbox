name: release

# Builds + publishes the three images on a version tag (v*.*.*).
#   broker / runtime  -> built from this repo's Dockerfiles
#   router            -> SELF-BUILT from upstream kubernetes-sigs/agent-sandbox@v0.5.3
#                        (decision D3 — reproducible, version-locked; no ad-hoc :latest)
# Images: ghcr.io/${{ repository_owner }}/open-sandbox-{broker,runtime,router}:<tag>
# CI uses the built-in GITHUB_TOKEN; no owner secret required.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-broker
          tags: |
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: agent-sandbox-platform/broker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-runtime
          tags: |
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: agent-sandbox-platform/runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-router:
    # Self-build from upstream kubernetes-sigs/agent-sandbox (pinned tag).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream agent-sandbox@v0.5.3
        uses: actions/checkout@v4
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.3
          path: agent-sandbox
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-sandbox-router
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=agent-sandbox-v0.5.3
      - uses: docker/build-push-action@v6
        with:
          context: agent-sandbox
          file: agent-sandbox/sandbox-router/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v0.5.3
