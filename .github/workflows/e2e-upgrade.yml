name: e2e-upgrade

# Stateful upgrade / rollback e2e (issue #128; wired into CI by #144).
#
# Proves the Helm mechanics that per-PR lanes cannot: a persistent sandbox's
# per-user PVC survives `helm upgrade` (retained + reattached), and
# `helm rollback` reverts the runtime image tag with the data still in place.
#
# Scheduled weekly rather than per-PR: the mechanics only change when the
# chart's image/PVC plumbing changes, and the lane costs a full KIND +
# image-build cycle. Also runnable on demand via workflow_dispatch.
# Test file: tests/e2e/test_upgrade_rollback.py (E2E_UPGRADE=1).

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:05 UTC — off-peak for the shared runners
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_CLUSTER: open-websandbox-e2e-upgrade
      SYS_NS: agent-sandbox-system
      RUNTIME_NS: agent-sandbox-runtime
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Cache KIND node image
        id: kind-image-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kindest-node.tar
          key: kindest-node-v1.31.0
      - name: Load KIND node image from cache
        if: steps.kind-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/kindest-node.tar
      - name: Pull & save KIND node image (cache miss)
        if: steps.kind-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull kindest/node:v1.31.0
          docker save kindest/node:v1.31.0 -o /tmp/kindest-node.tar

      - name: Create KIND cluster (runc)
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.31.0
          wait: 60s

      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4

      # Same tags/scopes as e2e.yml so the gha layer cache is shared — this
      # lane only adds a second tag (upgrade target B) for the SAME images:
      # the test proves the MECHANICS (retention + revert), not a version skew.
      - name: Build platform image (broker)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/broker/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-broker:v0.1.1
          cache-from: type=gha,scope=open-websandbox-broker
          cache-to: type=gha,mode=max,scope=open-websandbox-broker

      - name: Build platform image (runtime)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/runtime/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-runtime:v0.1.1
          cache-from: type=gha,scope=open-websandbox-runtime
          cache-to: type=gha,mode=max,scope=open-websandbox-runtime

      - name: Checkout upstream agent-sandbox@v0.5.3 (router self-build)
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: v0.5.3
          path: agent-sandbox

      - name: Self-build sandbox-router
        uses: docker/build-push-action@v7
        with:
          context: agent-sandbox
          file: agent-sandbox/sandbox-router/Dockerfile
          load: true
          provenance: false
          tags: open-websandbox-router:v0.1.1
          cache-from: type=gha,scope=open-websandbox-router
          cache-to: type=gha,mode=max,scope=open-websandbox-router

      # `helm upgrade --set imageTag=e2e-b` retags ALL platform images, so
      # every image needs an :e2e-b ref on the node (identical layers — the
      # point is the tag flip, not new content).
      - name: Retag images as the upgrade target (e2e-b)
        run: |
          for img in broker runtime router; do
            docker tag "open-websandbox-$img:v0.1.1" "open-websandbox-$img:e2e-b"
          done

      - name: Load images into KIND
        run: |
          for img in \
            open-websandbox-broker:v0.1.1 open-websandbox-runtime:v0.1.1 open-websandbox-router:v0.1.1 \
            open-websandbox-broker:e2e-b open-websandbox-runtime:e2e-b open-websandbox-router:e2e-b; do
            kind load docker-image "$img" --name "$KIND_CLUSTER"
          done

      - name: Helm install (per-user PVC profile, image A)
        run: |
          kubectl create namespace "$SYS_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace "$RUNTIME_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f open-websandbox-platform/chart/crds/
          kubectl wait --for=condition=Established --all crd --timeout=120s || true
          helm install open-websandbox open-websandbox-platform/chart/ \
            -f open-websandbox-platform/chart/values-kind-pvc.yaml -n "$SYS_NS"
          kubectl -n "$SYS_NS" rollout status deploy/owui-broker --timeout=180s

      - name: Install test deps
        run: pip install -r requirements-test.txt

      - name: Run upgrade/rollback e2e
        run: |
          set -euo pipefail
          kubectl -n "$SYS_NS" port-forward svc/owui-broker 8889:8080 &
          PF=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8889/healthz >/dev/null && break; sleep 1; done
          SECRET="$(kubectl -n "$SYS_NS" get secret owui-broker-secret \
            -o jsonpath='{.data.shared-secret}' | base64 -d)"
          BROKER_URL=http://localhost:8889 BROKER_SECRET="$SECRET" E2E_UPGRADE=1 \
            E2E_IMAGE_A=open-websandbox-runtime:v0.1.1 \
            E2E_IMAGE_B=open-websandbox-runtime:e2e-b \
            pytest tests/e2e/test_upgrade_rollback.py -v
          kill "$PF"

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          echo "=== broker pods ==="
          kubectl -n "$SYS_NS" get pods -o wide || true
          echo "=== helm history ==="
          helm history open-websandbox -n "$SYS_NS" || true
          echo "=== broker logs ==="
          kubectl -n "$SYS_NS" logs deploy/owui-broker --tail=200 || true
          echo "=== PVCs ==="
          kubectl -n "$RUNTIME_NS" get pvc -o wide || true
          echo "=== runtime sandboxes + pods ==="
          kubectl -n "$RUNTIME_NS" get sandbox,pods -o wide || true
          kubectl -n "$SYS_NS" get events --sort-by=.lastTimestamp | tail -25 || true
