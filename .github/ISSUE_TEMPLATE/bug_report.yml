name: 🐛 Bug report
description: Something in open-websandbox is not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! A few details up front help
        us reproduce it quickly. If you suspect a **security** issue, do **not**
        use this form — report it privately via the Security tab (see
        [SECURITY.md](../../SECURITY.md)).

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction — the exact commands / values you used.
      placeholder: |
        1. `helm install open-websandbox open-websandbox-platform/chart -f my-values.yaml`
        2. Send a request to the broker ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: What you expected to happen, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Broker / runtime / controller logs, `kubectl describe`, or broker error responses. Paste as a code block.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How to reproduce your setup. All fields help.
      value: |
        - open-websandbox chart/app version:
        - Kubernetes version (kubectl version):
        - Sandbox runtime: gVisor (runsc) / runc:
        - Node OS + kernel:
        - Storage class for persistent sandboxes (RWX?):
        - broker.replicas:
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security issue (I would use a private report instead).
          required: true
