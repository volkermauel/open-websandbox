name: ✨ Feature / enhancement
description: Suggest a new capability or improvement for open-websandbox
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Tell us the problem first, then the solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The concrete use case or pain point. What is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: The capability or behavior you want. Any API / Helm value / config shape you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you tried, or other approaches you rejected.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links to related issues/PRs, upstream references, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
