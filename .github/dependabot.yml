# Dependabot configuration for open-websandbox.
#
# Tracks every dependency ecosystem in use and groups updates per directory so
# each ecosystem surfaces as a single reviewable PR per cycle:
#   - pip ........ agent-sandbox-platform/{broker,runtime} + repo-root test deps
#   - github-actions ... .github/workflows/*.yml (actions/* stay current)
#   - docker ..... base images in agent-sandbox-platform/{broker,runtime}/Dockerfile
#
# Patch-level bumps are auto-merged once CI is green by
# .github/workflows/dependabot-automerge.yml; minor/major bumps stay open for
# manual review.
version: 2
updates:
  # --- Python (pip) ---------------------------------------------------------
  # Repo-root test tooling: requirements-test.in -> requirements-test.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-test-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # Broker service: requirements.in -> requirements.txt
  - package-ecosystem: "pip"
    directory: "/agent-sandbox-platform/broker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-broker-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # Runtime server + curated agent-common libs:
  # requirements-app.in / requirements-common.in -> *.txt
  - package-ecosystem: "pip"
    directory: "/agent-sandbox-platform/runtime"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-runtime-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # --- GitHub Actions -------------------------------------------------------
  # Keeps actions/* (and other workflow uses:) current across ci/e2e/release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # --- Docker base images ---------------------------------------------------
  # Tracks `FROM python:3.12-slim` so Dependabot opens PRs pinning/bumping it.
  # Broker image:
  - package-ecosystem: "docker"
    directory: "/agent-sandbox-platform/broker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-broker:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
  # Runtime image:
  - package-ecosystem: "docker"
    directory: "/agent-sandbox-platform/runtime"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-runtime:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
