apiVersion: v2
name: open-sandbox
description: >
  Open Sandbox platform for Open WebUI — broker, sandbox-router, SandboxTemplate,
  SandboxWarmPool and runtime isolation guardrails (NetworkPolicy, ResourceQuota,
  shared PVC). Also bundles the vendored upstream agent-sandbox controller + the
  agents.x-k8s.io CRDs (toggleable via upstream.deploy) for one-command install.
type: application
version: 0.2.0
appVersion: "0.1.0"
keywords:
  - open-webui
  - sandbox
  - agents
  - kubernetes
