# Shared RWX PVC backing /workspace for the shared-subPath persistent profile
# (BROKER_PERSISTENT_MODE=shared-subpath). One volume shared by all users; each
# user's sandbox mounts only users/<user-id>/ of it at /workspace (hard isolation).
# NOT used by the per-user-pvc profile (BROKER_PERSISTENT_MODE=per-user-pvc), which
# gives every user their own PVC via SandboxClaim volumeClaimTemplates.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-shared
  namespace: agent-sandbox-runtime
  labels: {app.kubernetes.io/managed-by: owui-broker}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs
  resources:
    requests:
      storage: 50Gi
