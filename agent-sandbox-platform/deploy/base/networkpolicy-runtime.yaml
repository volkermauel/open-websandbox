# Sandbox-runtime isolation (revised for dynamic dep installs, pip/npm).
# default-deny ingress+egress; allow:
#   ingress  — only the router (agent-sandbox-system) on the runtime port 8888
#   egress   — DNS, and HTTPS (443) to the internet for package installs,
#              EXCLUDING cluster pod/service/host CIDRs so a sandbox cannot reach
#              internal services. (Phase 4 swaps 443 for a domain-allowlisting proxy.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-runtime-default-deny
  namespace: agent-sandbox-runtime
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-sandbox-system
      ports:
        - { protocol: TCP, port: 8888 }
  egress:
    - to:
        - ipBlock: { cidr: 10.96.0.10/32 }   # kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16      # pod CIDR
              - 10.96.0.0/24    # service CIDR (apiserver, dns, ...)
              - 10.0.1.0/24     # node host network
      ports:
        - { protocol: TCP, port: 443 }
