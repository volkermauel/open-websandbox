# Open WebUI broker: auth + session->sandbox + reverse-proxy to the router.
# Lives in agent-sandbox-system; needs RBAC in agent-sandbox-runtime to manage
# SandboxClaims and read Sandboxes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: owui-broker
  namespace: agent-sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: owui-broker
  namespace: agent-sandbox-runtime
rules:
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims", "sandboxtemplates"]   # claims (per-user-pvc) + templates (read base for shared-subpath)
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Sandboxes live in the `agents.x-k8s.io` group (not extensions). The broker reads
# operatingMode and patches Suspended/Running to park/resume persistent sandboxes,
# and (persistent mode) creates + deletes per-chat Sandbox objects directly.
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# per-user-pvc mode: the broker creates/reads per-user PVCs directly (CoreV1).
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owui-broker
  namespace: agent-sandbox-runtime
subjects:
- kind: ServiceAccount
  name: owui-broker
  namespace: agent-sandbox-system
roleRef:
  kind: Role
  name: owui-broker
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owui-broker
  namespace: agent-sandbox-system
  labels: {app.kubernetes.io/name: owui-broker}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: owui-broker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: owui-broker}}
    spec:
      serviceAccountName: owui-broker
      containers:
      - name: broker
        image: owui-broker:v2
        imagePullPolicy: Never
        ports: [{containerPort: 8080}]
        env:
        - {name: BROKER_SHARED_SECRET, valueFrom: {secretKeyRef: {name: owui-broker-secret, key: shared-secret}}}
        - {name: BROKER_WARMPOOL, value: "code-standard-warmpool"}
        - {name: BROKER_RUNTIME_NS, value: "agent-sandbox-runtime"}
        - {name: BROKER_ROUTER_URL, value: "http://sandbox-router-svc.agent-sandbox-system:8080"}
        - {name: BROKER_IDLE_TTL_SECONDS, value: "120"}   # ephemeral reap (return to warm pool)
        - {name: BROKER_DEFAULT_PROFILE, value: "persistent"}      # OWUI can't send X-Persistence; fixed at deploy
        - {name: BROKER_PERSISTENT_STORAGE, value: "10Gi"}            # per-user PVC size (per-user-pvc mode)
        - {name: BROKER_PERSISTENT_MODE, value: "per-user-pvc"}      # per-user-pvc | shared-subpath
        - {name: BROKER_PARK_IDLE_SECONDS, value: "120"}  # persistent suspend (cold-start 1-6s); pairs with IDLE_TTL
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: owui-broker
  namespace: agent-sandbox-system
spec:
  selector: {app.kubernetes.io/name: owui-broker}
  ports: [{port: 8080, targetPort: 8080}]
