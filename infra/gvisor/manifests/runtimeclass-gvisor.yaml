# RuntimeClass for gVisor (cluster-scoped). Pods opt in with `runtimeClassName: gvisor`.
#
# Currently deployed on this cluster: Variant A (simple) — lands on any node that
# has the runsc handler (today: w1, w2, w3).
#
# When you dedicate + taint sandbox worker nodes (AgentSandbox.md §6.3), switch to
# Variant B by uncommenting the `scheduling:` block, after labelling/ainting nodes:
#   kubectl label node <node> workload.open-websandbox.local/type=agent-sandbox
#   kubectl taint  node <node> workload.open-websandbox.local/type=agent-sandbox:NoSchedule
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
#scheduling:
