[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Explicit, narrow rule set so the repo is self-contained (ruff won't inherit a parent
# directory's config) and CI linting is deterministic across ruff releases. This is
# ruff's documented stable default (E4/E7/E9/F) plus isort (I).
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
# pytest-asyncio: every async test/fixture is auto-collected, no markers needed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
filterwarnings = [
    # uvicorn (in the live-server fixture) is noisy on stdout; silence its access logs.
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
# measured by module name (tests import `server` and `main` directly via sys.path)
source = ["server", "main"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
# keep the report focused on the two production modules
include = ["*/server.py", "*/main.py"]
