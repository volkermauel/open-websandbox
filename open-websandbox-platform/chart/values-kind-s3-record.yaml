# KIND/runc profile for the s3-record e2e lane
# (openspec s3-termination-finalizer).
#
# Runs the broker with broker.persistentMode=s3-record pointed at the
# in-cluster RustFS fixture (tests/e2e/fixtures/rustfs.yaml). The hot tier is
# an emptyDir /workspace (scratch.storageClass empty -> no VCT, matching the
# blessed live posture); S3 is the store of record. idleTtlSeconds +
# reaperPollSeconds are lowered so the offload-on-reap and
# termination-finalizer paths are exercised deterministically within the test
# timeout. The record pool renders its template + pool key (claims
# cold-create members) with replicas 0 — the finalizer contract is
# independent of warm claiming.
sandboxTemplate:
  runtimeClassName: ""   # runc (KIND can't nest gVisor)
  maxProcs: 100000       # KIND shared-kernel NPROC collision
router:
  kubeApiServerCidr: "10.96.0.1/32"   # KIND service CIDR (kubeadm default)
  kubeDnsCidr: "10.96.0.10/32"
broker:
  defaultProfile: persistent
  persistentMode: s3-record
  idleTtlSeconds: 15     # reap (offload) idle sandboxes fast
  parkIdleSeconds: 15
  s3:
    enabled: true
    endpoint: "http://rustfs.agent-sandbox-system:9000"
    bucket: "owsb-e2e"
    prefix: "users"
    region: "us-east-1"
    # created by tests/e2e/fixtures/rustfs.yaml
    credentialsSecret: "owui-s3-creds"
    retentionDays: 1
    compression: zstd
    sse: ""              # dev RustFS has no KMS/SSE backend; the broker
                         # omits the header
    periodicSyncInterval: 600   # keep the periodic sweep out of the way
    sizeLimit: "2Gi"
    tmpfs: false
    terminationFinalizer: true  # the contract under test
    reaperPollSeconds: 10       # fast, deterministic offload-on-reap
sharedPvc:
  storageClass: standard       # local-path
  accessModes: [ReadWriteOnce] # local-path is RWO (unused in this lane)

warmPool:
  replicas: 0
  record:
    enabled: true              # render code-standard-s3-v1 + pool key
    replicas: 0                # claims cold-create; warm claiming not under
                               # test here
    scratch:
      storageClass: ""         # emptyDir scratch (S3 is the store of record)
