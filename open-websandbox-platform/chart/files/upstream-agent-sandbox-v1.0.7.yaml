# Vendored upstream agent-sandbox CONTROLLER slice (non-CRD, non-Namespace), v1.0.7 —
# controller Deployment, RBAC (ServiceAccount/ClusterRole/Bindings) and Service.
# The v1.0.x line removed the conversion webhook: the webhook Service, the
# namespaced webhook-cert Role/RoleBinding and the controller's CRD
# get/patch/update ClusterRole rule are gone upstream. Rendered verbatim by
# templates/upstream/upstream.yaml (gated by upstream.deploy).
#
# SOURCE (canonical, verbatim, SHA-pinned — DO NOT edit here; edit the source and regenerate):
