# Open WebUI broker: auth + session->sandbox + reverse-proxy to the router.
# Lives in agent-sandbox-system; needs RBAC in agent-sandbox-runtime to manage
# SandboxClaims and read Sandboxes.
{{- $sysNs := include "open-websandbox.systemNamespace" . -}}
{{- $runNs := include "open-websandbox.runtimeNamespace" . -}}
{{- $shared := include "open-websandbox.brokerSharedSecret" . -}}
{{/* Resolve the runtime inter-component key ONCE here. Default it to the broker shared
     secret so the broker's Bearer on POST /api/terminals matches RUNTIME_API_KEY;
     sandboxTemplate.runtimeApiKey overrides (then keep it equal to broker.sharedSecret).
     One resolution, not two — resolving in separate template documents would mint two
     randAlphaNum keys on a first install and break the broker->runtime hop. */}}
{{- $runtimeKey := .Values.sandboxTemplate.runtimeApiKey | default $shared -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: owui-broker-secret
  namespace: {{ $sysNs }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Resolved via the open-websandbox.brokerSharedSecret helper: explicit value, else the
  # existing Secret is preserved across upgrades (lookup), else a random 48-char secret
  # is generated on first install. Never the dev placeholder.
  shared-secret: {{ $shared | quote }}
  # Same RUNTIME_API_KEY value duplicated into the broker namespace: the broker pod runs
  # in agent-sandbox-system and CANNOT cross-reference owui-runtime-secret (runtime
  # namespace), so it reads the key from its own Secret to attach the Bearer on runtime hops.
  runtime-api-key: {{ $runtimeKey | quote }}
---
# Runtime inter-component API key (runtime namespace). The runtime pod reads
# RUNTIME_API_KEY from here; the value defaults to the SAME secret resolved above so
# the broker's Bearer on POST /api/terminals matches. sandboxTemplate.runtimeApiKey
# overrides it (then keep it equal to broker.sharedSecret). Resolved once, not per-doc.
apiVersion: v1
kind: Secret
metadata:
  name: owui-runtime-secret
  namespace: {{ $runNs }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  runtime-api-key: {{ $runtimeKey | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: owui-broker
  namespace: {{ $sysNs }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: owui-broker
  namespace: {{ $runNs }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
rules:
# claims (per-user-pvc) + templates (read base for shared-subpath)
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims", "sandboxtemplates"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Sandboxes live in the `agents.x-k8s.io` group (not extensions). The broker reads
# operatingMode and patches Suspended/Running to park/resume persistent sandboxes,
# and (persistent mode) creates + deletes per-chat Sandbox objects directly.
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# per-user-pvc mode: the broker creates/reads per-user PVCs directly (CoreV1).
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Leader election (HA): the broker holds a coordination.k8s.io/Lease so only the elected
# replica runs the reaper. At replicas=1 (default) the sole broker always wins — a no-op.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owui-broker
  namespace: {{ $runNs }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: owui-broker
  namespace: {{ $sysNs }}
roleRef:
  kind: Role
  name: owui-broker
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owui-broker
  namespace: {{ $sysNs }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.broker.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: owui-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owui-broker
        # This chart does not template a Namespace resource (both namespaces are
        # pre-created — see NOTES.txt), so the Pod Security Standard labels are declared
        # on the Pod as an intent marker. For real admission enforcement, set these
        # three labels on the namespaces (agent-sandbox-system / agent-sandbox-runtime).
        # The pod + container securityContext below makes the broker actually compliant
        # with the `restricted` profile.
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
      {{- if .Values.broker.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.broker.metrics.port | quote }}
        prometheus.io/path: {{ .Values.broker.metrics.path | quote }}
      {{- end }}
    spec:
      # NOTE: token stays mounted — the broker talks to the kube API (SandboxClaims,
      # Sandboxes, PVCs) as its own ServiceAccount. Do not set automountServiceAccountToken: false here.
      serviceAccountName: owui-broker
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml . | nindent 8 }}
{{- end }}
      # Restricted-PSS lockdown mirroring the router + runtime pods. readOnlyRootFilesystem
      # means the Python process cannot write bytecode next to its source or to /; a writable
      # emptyDir /tmp is mounted below. If the image writes bytecode elsewhere, also set
      # PYTHONDONTWRITEBYTECODE=1 in the broker image/env.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: broker
        image: {{ include "open-websandbox.image" (dict "Values" .Values "repo" "open-websandbox-broker") }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: BROKER_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: owui-broker-secret
              key: shared-secret
        - name: RUNTIME_API_KEY
          valueFrom:
            secretKeyRef:
              name: owui-broker-secret
              key: runtime-api-key
        - name: BROKER_WARMPOOL
          value: {{ .Values.broker.warmPool | quote }}
        - name: BROKER_RUNTIME_NS
          value: {{ .Values.broker.runtimeNs | quote }}
        - name: BROKER_ROUTER_URL
          value: {{ .Values.broker.routerUrl | quote }}
        - name: BROKER_IDLE_TTL_SECONDS
          value: {{ .Values.broker.idleTtlSeconds | quote }}
        - name: BROKER_DEFAULT_PROFILE
          value: {{ .Values.broker.defaultProfile | quote }}
        - name: BROKER_PERSISTENT_STORAGE
          value: {{ .Values.broker.persistentStorage | quote }}
        - name: BROKER_PERSISTENT_MODE
          value: {{ .Values.broker.persistentMode | quote }}
        - name: BROKER_PARK_IDLE_SECONDS
          value: {{ .Values.broker.parkIdleSeconds | quote }}
        startupProbe:
          httpGet:
            path: {{ .Values.broker.probes.startup.path }}
            port: http
          periodSeconds: {{ .Values.broker.probes.startup.periodSeconds }}
          failureThreshold: {{ .Values.broker.probes.startup.failureThreshold }}
        livenessProbe:
          httpGet:
            path: {{ .Values.broker.probes.liveness.path }}
            port: http
          periodSeconds: {{ .Values.broker.probes.liveness.periodSeconds }}
          failureThreshold: {{ .Values.broker.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.broker.probes.readiness.path }}
            port: http
          periodSeconds: {{ .Values.broker.probes.readiness.periodSeconds }}
          failureThreshold: {{ .Values.broker.probes.readiness.failureThreshold }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: owui-broker
  namespace: {{ $sysNs }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: owui-broker
  ports:
  - name: http
    port: 8080
    targetPort: http
