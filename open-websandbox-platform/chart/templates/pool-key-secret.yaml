{{- if gt (.Values.warmPool.replicas | int) 0 }}
# POOL-scoped runtime API key (ephemeral warm-pool claiming): mounted by the
# dedicated pool SandboxTemplate so warm pods can boot under the runtime's
# fail-closed key guard (#4) BEFORE any session exists. The broker
# authenticates broker→pod hops for claimed ephemeral sandboxes with this key
# (owui.io/auth=pool-key). Persistent sandboxes keep per-session keys.
# Production: set broker.poolRuntimeKey (openssl rand -hex 32) — do not ship
# the placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: owui-pool-key
  namespace: {{ include "open-websandbox.runtimeNamespace" . }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
    owui.io/component: runtime-key
type: Opaque
stringData:
  api-key: {{ .Values.broker.poolRuntimeKey | quote }}
{{- end }}
