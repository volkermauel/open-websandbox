# Sandbox-runtime isolation. default-deny ingress+egress; allow:
#   ingress  — only the router (agent-sandbox-system) on the runtime port 8888
#   egress   — DNS to PUBLIC resolvers (dnsPolicy: None — no cluster-DNS IP / no
#              namespace search-domain leak), and HTTPS/HTTP to the internet for
#              package installs, EXCLUDING all RFC1918/link-local so a sandbox
#              cannot reach the cluster/internal nets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-runtime-default-deny
  namespace: {{ include "open-websandbox.runtimeNamespace" . }}
  labels:
    {{- include "open-websandbox.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ include "open-websandbox.systemNamespace" . }}
    ports:
    - protocol: TCP
      port: 8888
  {{- if .Values.monitoring.prometheus.enabled }}
  - from:                               # Prometheus scraper (PodMonitor) — runtime :8888
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.monitoring.prometheus.scrapeNamespace | quote }}
      {{- with .Values.monitoring.prometheus.scrapePodLabels }}
      podSelector:
        matchLabels:
          {{- toYaml . | nindent 10 }}
      {{- end }}
    ports:
    - protocol: TCP
      port: 8888
  {{- end }}
  egress:
  - to:                               # DNS — public resolvers (matches dnsPolicy: None)
    {{- range .Values.networkPolicy.egress.dnsNameservers }}
    - ipBlock:
        cidr: {{ . }}/32
    {{- end }}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:                               # DNS — public resolvers IPv6 (matches dnsPolicy: None)
    {{- range .Values.networkPolicy.egress.dnsNameserversV6 }}
    - ipBlock:
        cidr: {{ . }}/128
    {{- end }}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:                               # HTTPS+HTTP (IPv4) — pip/npm/git + curl
    - ipBlock:
        cidr: 0.0.0.0/0
        except:                       # block ALL private — anti-lateral-movement
        {{- range .Values.networkPolicy.egress.exceptCIDRs }}
        - {{ . }}
        {{- end }}
    ports:
    {{- range .Values.networkPolicy.egress.httpsPorts }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
  - to:                               # HTTPS+HTTP (IPv6)
    - ipBlock:
        cidr: ::/0
        except:
        - fc00::/7                    # ULA
        - fe80::/10                   # link-local
    ports:
    {{- range .Values.networkPolicy.egress.httpsPorts }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
